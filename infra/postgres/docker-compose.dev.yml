services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dosa_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dosa_os"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dosa_postgres_dev:/var/lib/postgresql/data

volumes:
  dosa_postgres_dev:
